<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0B2F7A">
  <title>You’re offline | Aqua Chem Labs</title>
  <meta name="description" content="Aqua Chem Labs is temporarily unavailable offline. Reconnect to access current product and technical information.">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .offline-card{max-width:44rem;margin:clamp(2rem,8vh,6rem) auto;padding:2rem;border:1px solid #D9E7F5;border-radius:1rem;background:#fff;box-shadow:0 12px 36px rgba(11,47,122,.08)}
    .offline-card h1{color:#0B2F7A;font-size:clamp(1.8rem,5vw,2.7rem);margin:0 0 1rem}
    .offline-card p{margin:0 0 1.25rem}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="offline-card" aria-labelledby="offline-title">
      <p class="section-kicker">Aqua Chem Labs</p>
      <h1 id="offline-title">You appear to be offline</h1>
      <p>Reconnect to the internet to access the latest plant specifications, chemical information and technical guides. This offline screen does not replace or store those pages.</p>
      <button class="btn" type="button" onclick="window.location.reload()">Try again</button>
      <p style="margin-top:1rem"><a href="/">Return to the home page</a></p>
    </section>
  </main>
</body>
</html>
