name: Website quality gate

on:
  push:
    branches: [main, seo-performance-10-10]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  site-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Audit HTML, metadata, links and sitemap
        run: npm run audit
