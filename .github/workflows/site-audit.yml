name: Website quality gate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Static site audit
        run: npm run audit
      - name: Script integrity audit
        run: npm run script-audit
      - name: Structured-data validation
        run: npm run structured-data-audit
      - name: Production build
        run: npm run build
      - name: Browser and interaction QA
        run: |
          npx playwright install --with-deps chromium
          npm run runtime-audit
