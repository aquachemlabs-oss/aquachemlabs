name: Site build and SEO checks

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build optimized static site
        run: npm run build
      - name: Audit links, metadata, sitemap, redirects and SEO basics
        run: npm run audit
      - name: Audit SEO hardening
        run: npm run seo-hardening-audit
      - name: Audit structured data
        run: npm run structured-data-audit
