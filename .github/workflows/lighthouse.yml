name: Lighthouse audit
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - name: Build production site
        run: npm run build
      - name: Verify PWA output and SEO-safe caching
        run: npm run pwa-audit
      - name: Audit production image, font and layout optimizations
        run: npm run performance-audit
      - name: Run Lighthouse mobile across all public pages
        run: npx --yes @lhci/cli@0.14.x autorun --config=.lighthouserc.json
      - name: Run Lighthouse desktop on key conversion pages
        run: npx --yes @lhci/cli@0.14.x autorun --config=.lighthouserc.desktop.json
      - name: Upload Lighthouse report artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lighthouse-report
          path: .lighthouseci/
          if-no-files-found: warn
          include-hidden-files: true
          retention-days: 14
