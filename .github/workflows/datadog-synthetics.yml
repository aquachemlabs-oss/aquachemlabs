# Run Datadog Synthetic tests when repository secrets are configured.
# Add DD_API_KEY and DD_APP_KEY in repository Actions secrets to enable the tests.
name: Run Datadog Synthetic tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      DD_API_KEY: ${{ secrets.DD_API_KEY }}
      DD_APP_KEY: ${{ secrets.DD_APP_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Run Datadog Synthetic tests
        if: ${{ env.DD_API_KEY != '' && env.DD_APP_KEY != '' }}
        uses: DataDog/synthetics-ci-github-action@87b505388a22005bb8013481e3f73a367b9a53eb # v1.4.0
        with:
          api_key: ${{ env.DD_API_KEY }}
          app_key: ${{ env.DD_APP_KEY }}
          test_search_query: 'tag:e2e-tests'

      - name: Explain why Datadog tests were skipped
        if: ${{ env.DD_API_KEY == '' || env.DD_APP_KEY == '' }}
        run: echo "Datadog Synthetic tests skipped because DD_API_KEY and/or DD_APP_KEY repository secrets are not configured."
