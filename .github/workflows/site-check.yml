name: Site checks

on:
  push:
    branches: ["main", "site-audit-improvements-2026"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/validate-site.mjs
