name: Site checks

on:
  push:
    branches: ["main", "site-audit-improvements-2026"]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install runtime dependencies
        run: npm install
      - name: Validate site structure
        run: node scripts/validate-site.mjs
      - name: Validate every JavaScript source and script reference
        run: node scripts/script-audit.mjs
