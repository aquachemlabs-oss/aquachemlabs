name: Runtime site QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Static and script QA
        run: |
          npm run audit
          npm run script-audit
          npm run structured-data-audit
          npm run seo-hardening-audit
      - name: Browser runtime QA
        run: npm run runtime-audit
