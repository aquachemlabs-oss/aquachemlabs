name: Runtime site QA
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  runtime:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Report dependency vulnerabilities
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit.json || true
          node --input-type=module -e '
            import fs from "node:fs";
            const report = JSON.parse(fs.readFileSync("/tmp/npm-audit.json", "utf8"));
            const vulns = report.metadata?.vulnerabilities || {};
            console.log("Dependency vulnerability summary:", JSON.stringify(vulns));
            for (const [name, item] of Object.entries(report.vulnerabilities || {})) {
              console.log(JSON.stringify({package:name,severity:item.severity,range:item.range,fixAvailable:item.fixAvailable,via:item.via?.map(v=>typeof v==="string"?v:{name:v.name,title:v.title,range:v.range,url:v.url})}));
            }
          '
      - name: Install Playwright Chromium
        # Avoid apt's optional --with-deps path, which has failed when the Ubuntu
        # hosted runner's Microsoft package mirror returns 403. GitHub's runner
        # image already includes the browser system libraries.
        run: npx playwright install chromium
      - name: Build production site before generated HTML audits
        run: npm run build
      - name: Static, script, schema and SEO QA (run every audit)
        shell: bash
        run: |
          failed=0
          for audit in audit script-audit structured-data-audit seo-hardening-audit google-tag-audit pwa-audit asset-performance-audit; do
            echo "::group::npm run $audit"
            if npm run "$audit"; then
              echo "PASS: $audit"
            else
              echo "::error::Audit failed: $audit"
              failed=1
            fi
            echo "::endgroup::"
          done
          exit "$failed"
      - name: Browser runtime QA
        run: npm run runtime-audit
